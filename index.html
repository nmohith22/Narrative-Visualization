<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Resolutions</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-svg-annotation@2/d3-annotation.min.js"></script>
</head>
<body>
    <div id="container">
        <header>
            <h1>💪 Gym Resolutions <span style="display: inline-block; transform: scaleX(-1);">💪</span></h1>
            <p style="font-size: 14px; color: #94a3b8; margin-top: -5px;"><i>Hover over data elements for details. Click the legend boxes to toggle categories.</i></p>
            <p id="scene-description">Loading data...</p>
        </header>
        
        <div id="drill-down-nav">
            <button id="btn-scene1" class="active overview-btn">Overview: The Ghosting Epidemic</button>
            
            <div id="drill-down-options">
                <span>Drill down into factors:</span>
                <button id="btn-scene2" class="drill-btn">↳ Demographics (Age)</button>
                <button id="btn-scene3" class="drill-btn">↳ Commitment (Contracts)</button>
                <button id="btn-scene4" class="drill-btn">↳ Location (Distance)</button>
                <button id="btn-scene5" class="drill-btn">↳ Behavior (Weekly Visits)</button>
            </div>
        </div>

        <main id="viz-container">
            <!-- SVG will be injected here -->
        </main>
        
        <div id="tooltip" class="hidden"></div>
    </div>
    <script src="setup.js"></script>
    <script src="overview.js"></script>
    <script src="grouped_bars.js"></script>
    <script src="distance.js"></script>
    <script src="behavior.js"></script>
    <script src="main.js"></script>
</body>
</html>
